# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: model-timing
      name: './model-timing.ts'
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        binding: agent-created
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'

# This authored case uses the shipped headless profile and existing Team initializer.
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- insert:
    - id: agent-team
      name: '@vuhoi/gat-core'
    - id: tool-agent-team
      name: '@vuhoi/gat-tools'
      config:
        freshProvider: spawn
        forkProvider: fork
        minExecutionMembers: 1
        maxExecutionMembers: 1
        simpleMode: true
        teamMembersMaxBytes: 65536
        externalRestrictedTools: [glob, grep, read, read_image]
    - id: gat-durable-provider
      name: '@vuhoi/gat-durable-agent/provider'
    - id: gat-durable-execution
      name: '@vuhoi/gat-durable-agent/execution-composition'
      config:
        workspace: !!js dshHomePath('gat-durable-execution-workspace')
        dedicatedProvider: true
        singleHostWorkspace: true
        members:
          - mode: task
            declaration:
              name: worker
              description: Explicit task memory worker
              prompt: 'ROLE_ONLY: declare readiness without reading memory or executing a task.'
              context: fresh
              scope: workspace
              provider: deepseek-official
              model: deepseek-v4-flash
        limits:
          maxBodyBytes: 4096
          maxResultBytes: 8192
          maxSelectedItems: 8
          maxReadCalls: 8
          maxReadResultBytes: 32768
    - id: gat-durable-fixture-host
      name: './fixture-host.ts'
      config:
        workspace: !!js dshHomePath('gat-durable-execution-workspace')
