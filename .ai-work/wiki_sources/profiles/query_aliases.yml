# được thêm vào query token set trước khi scoring (lookup_wiki_source.py / _common.expand_query_tokens).
# Format mỗi dòng: "- <phrase> => <target tokens>" (phrase + targets đều được diacritic-fold tự động;
# viết có dấu hay không dấu đều được). PROJECT-CUSTOMIZABLE — thêm alias khi phát hiện
# language-variant miss (MP2, lookup_miss_patterns.md); capture retrieval_improvement là nguồn alias tốt.
